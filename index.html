<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction - Blog Tech</title>
    <style>
        body {
            background-color: white;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            color: #333;
        }
        .container {
            text-align: center;
        }
        img {
            max-width: 300px;
            height: auto;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2rem;
            letter-spacing: -1px;
        }
        p {
            color: #777;
        }
        .loading-bar {
            width: 200px;
            height: 4px;
            background: #eee;
            margin: 20px auto;
            position: relative;
            overflow: hidden;
        }
        .loading-bar::after {
            content: '';
            display: block;
            width: 50px;
            height: 100%;
            background: #2c3e50;
            animation: move 2s infinite;
        }
        @keyframes move {
            0% { left: -50px; }
            100% { left: 200px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Inseriremo qui l'immagine -->
        <img src="assets/under-construction.svg" alt="Sito in costruzione">
        <h1>Work in Progress</h1>
          <div class="loading-bar"></div>
    </div>
</body>
</html>
